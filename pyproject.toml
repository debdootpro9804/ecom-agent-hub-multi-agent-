[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-hub"
version = "0.1.0"
description = "E-commerce agent hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "langchain>=1.0.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "langsmith>=0.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "pydantic[email]",
  "sqlalchemy>=2.0.0",
  "greenlet>=3.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "tenacity>=8.3.0",
  "infisical-python",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["migrations"]

